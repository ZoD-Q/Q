# Dedicated Q ingress. Install as /etc/nginx/conf.d/q-api-domain.conf.
# Alibaba Cloud's L7 load balancers use the reserved internal 100.64.0.0/10 range.
# Access checks use the original TCP peer, never a client-supplied header.
geo $realip_remote_addr $q_internal_http_peer {
    default 0;
    100.64.0.0/10 1;
    127.0.0.1/32 1;
    ::1/128 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name q.kaicloudpay.com;
    server_tokens off;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    access_log off;
    error_log /var/log/nginx/q-api-domain-error.log crit;
    client_max_body_size 2m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Accel-Buffering "no" always;

    location = /privacy {
        if ($q_internal_http_peer = 0) { return 308 https://q.kaicloudpay.com$request_uri; }
        alias /var/www/q/legal/privacy.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-6ZoH1ehIqzTqpwQcPHZefW+Kum7EKNhkVq8ibiW5uBg='; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }

    location = / {
        if ($q_internal_http_peer = 0) { return 308 https://q.kaicloudpay.com$request_uri; }
        return 302 /health;
    }
    location / {
        if ($q_internal_http_peer = 0) { return 308 https://q.kaicloudpay.com$request_uri; }
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host q.kaicloudpay.com;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Host q.kaicloudpay.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        gzip off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name q.kaicloudpay.com;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    access_log off;
    error_log /var/log/nginx/q-api-domain-error.log crit;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;

    location = /privacy {
        alias /var/www/q/legal/privacy.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-6ZoH1ehIqzTqpwQcPHZefW+Kum7EKNhkVq8ibiW5uBg='; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    }

    location = / { return 302 /health; }
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host q.kaicloudpay.com;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Host q.kaicloudpay.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        gzip off;
    }
}
