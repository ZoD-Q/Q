    # BEGIN Q BEAUTY GALLERY
    location = /plugins/beauty {
        __HTTP_PEER_GUARD__
        return 308 https://q.kaicloudpay.com/plugins/beauty/;
    }
    location ^~ /plugins/beauty/ {
        __HTTP_PEER_GUARD__
        limit_req zone=q_beauty_per_ip burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        proxy_http_version 1.1;
        proxy_set_header Host q.kaicloudpay.com;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Host q.kaicloudpay.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_pass http://127.0.0.1:18796/;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # END Q BEAUTY GALLERY
