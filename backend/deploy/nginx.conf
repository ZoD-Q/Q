worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Files contain exact, verified host bridge addresses: ADDRESS 1;
    # No matching files means no trusted host proxy. Never add private CIDR ranges.
    map $remote_addr $q_trusted_host_proxy {
        default 0;
        include /etc/nginx/trusted-host-proxies/*.conf;
    }
    map $http_x_forwarded_for $q_inbound_client_ip {
        default $http_x_forwarded_for;
        "" $remote_addr;
    }
    map $q_trusted_host_proxy $q_forwarded_client_ip {
        default $remote_addr;
        1 $q_inbound_client_ip;
    }
    server {
        listen 8080;
        client_max_body_size 2m;
        location / {
            set $q_backend api:8787;
            proxy_pass http://$q_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # The Rust boundary accepts only one valid IP from this trusted gateway.
            proxy_set_header X-Forwarded-For $q_forwarded_client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }
    }
}
